services:
  # Backend FastAPI Service (AI/ML matching engine + SQLite/PostgreSQL)
  - type: web
    name: nyaya-ai-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python run.py"
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: ENV
        value: production
      - key: NYAYA_SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"

  # Frontend React SPA Service (Vite Static Site)
  - type: web
    name: nyaya-ai-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: nyaya-ai-backend
          property: host
